[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-ai-context"
version = "0.1.0a2"
description = "Privacy-aware, verifiable conversation-to-context migration for AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "jzhao0"}]
keywords = ["llm", "context", "migration", "chatgpt", "conversation", "prompt", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.13,<0.14"]

[project.scripts]
paic = "portable_ai_context.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
