name: Linux Live Smoke

on:
  pull_request:
    branches: [main]

jobs:
  linux-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Run content-free ChatGPT share smoke
        env:
          PAIC_TEST_SHARE: https://chatgpt.com/share/6a84994a-b4b0-83e8-9f9b-e4e951f13e4f
        run: paic smoke "$PAIC_TEST_SHARE"
