name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Create isolated wheel smoke environment
        run: python -m venv .package-smoke-venv
      - name: Install built wheel only
        run: .package-smoke-venv/bin/python -m pip install dist/*.whl
      - name: Smoke installed distribution
        run: .package-smoke-venv/bin/python tools/package_smoke.py
      - name: Install optional tokenizer extra from built wheel
        run: |
          .package-smoke-venv/bin/python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          wheel_uri = wheels[0].resolve().as_uri()
          requirement = f"portable-ai-context[tokenizers] @ {wheel_uri}"
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", requirement]
          )
          PY
      - name: Smoke optional tokenizer extra
        run: .package-smoke-venv/bin/python tools/tokenizer_smoke.py
      - name: Install optional MCP extra from built wheel
        run: |
          .package-smoke-venv/bin/python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          wheel_uri = wheels[0].resolve().as_uri()
          requirement = f"portable-ai-context[mcp] @ {wheel_uri}"
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", requirement]
          )
          PY
      - name: Smoke optional MCP extra with official in-memory client
        run: .package-smoke-venv/bin/python tools/mcp_smoke.py
      - name: Lint Firefox MV3 extension with pinned Mozilla web-ext
        run: npx --yes web-ext@10.5.0 lint --source-dir extension --warnings-as-errors --boring
      - name: Build Firefox extension package with pinned Mozilla web-ext
        run: npx --yes web-ext@10.5.0 build --source-dir extension --artifacts-dir firefox-extension-dist --filename paic-firefox-extension.zip --overwrite-dest
      - name: Independently verify Firefox package security shape
        run: python tools/firefox_extension_package_smoke.py firefox-extension-dist
      - name: Require wheel, sdist, and Firefox package artifacts
        run: test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" && test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" && test -n "$(find firefox-extension-dist -maxdepth 1 -name '*.zip' -print -quit)"
